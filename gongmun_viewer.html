        keyPoints: [

          { label: "항목 구분 규정", value: "1. ▷ 가. ▷ 1) ▷ 가) ▷ (1) ▷ (가) ▷ ① ▷ ㉮ 순서로 체계적 들여쓰기 적용" },
          { label: "활용 목적", value: "대외 공문 발송, 협조문, 계획 보고서 작성 시 표준 레이아웃 참고용" }

      {

        keyPoints: [
          { label: "특징", value: "수신자란 및 발신명의(기관장 직인 등)가 생략되고 기안자·검토자·결재권자의 결재란 중심 구성" },
          { label: "활용", value: "기안 부서 내 결재, 업무계획 수립 보고서, 예산 집행 품의서 등" }
        ],

      {

        keyPoints: [
          { label: "결재선", value: "기안부처 장관 ▷ 국무총리 ▷ 대통령 서명란으로 이어지는 최고위 결재 규격" },
          { label: "규격", value: "엄격한 문서 마진 및 국새·대통령 직인 날인 위치 규정 반영" }
        ],
        tags: ["대통령결재", "국무회의", "최고위공문서", "국정안건"]
      },
      {
        id: "template_4",
        category: "template",
        categoryName: "공문서 서식",
        categoryBadge: "bg-emerald-100 text-emerald-700",
        fileType: "HWP",
        fileName: "gongmun_sample4_prime_minister.hwp",
        docNumber: "시행규칙 [별지 제4호서식]",
        title: "국무총리 결재문서 표준 서식",
        date: "상시 서식 규격",
        organization: "행정안전부 / 국무조정실",
        summary: "부처 간 정책 조정이나 국무총리 훈령, 총리 재가가 필요한 정책 보고에 사용되는 전용 공문서 서식입니다.",
        keyPoints: [
          { label: "특징", value: "주무부처 장관 결재 후 국무총리 결재 및 부총리 협의 결재선 배치" }
        ],
        tags: ["총리결재", "정책조정", "정부표준서식"]
      }
    ];

    let currentCategory = 'all';
    let currentSelectedId = 'notice_1';
    let searchQuery = '';

    // Initialize counts
    function updateCounts() {
      document.getElementById('count-all').innerText = documents.length;
      document.getElementById('count-notice').innerText = documents.filter(d => d.category === 'notice').length;
      document.getElementById('count-law').innerText = documents.filter(d => d.category === 'law').length;
      document.getElementById('count-template').innerText = documents.filter(d => d.category === 'template').length;
    }

    // Filter by Category
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = "category-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
      });
      document.getElementById(`tab-${cat}`).className = "category-btn px-3 py-1.5 rounded-lg bg-white text-blue-700 shadow-xs transition";
      renderList();
    }

    // Search Handler
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderList();
    }

    // Render Document List Cards
    function renderList() {
      const container = document.getElementById('docListContainer');
      const filtered = documents.filter(doc => {
        const matchesCategory = currentCategory === 'all' || doc.category === currentCategory;
        const matchesSearch = !searchQuery || 
          doc.title.toLowerCase().includes(searchQuery) ||
          doc.docNumber.toLowerCase().includes(searchQuery) ||
          doc.fileName.toLowerCase().includes(searchQuery) ||
          doc.tags.some(t => t.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400">
            <i data-lucide="folder-search" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm font-semibold">검색 조건에 맞는 공문서가 없습니다.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // If currently selected doc is not in filtered list, select the first one
      if (!filtered.some(d => d.id === currentSelectedId)) {
        currentSelectedId = filtered[0].id;
      }

      container.innerHTML = filtered.map(doc => {
        const isSelected = doc.id === currentSelectedId;
        const borderClass = isSelected ? "border-blue-500 bg-blue-50/40 ring-2 ring-blue-500/20" : "border-slate-200 bg-white hover:border-slate-300";
        return `
          <div onclick="selectDocument('${doc.id}')" 
               class="p-4 rounded-xl border ${borderClass} cursor-pointer transition shadow-xs flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between text-xs mb-1.5">
                <span class="px-2 py-0.5 rounded-md font-bold ${doc.categoryBadge}">
                  ${doc.categoryName}
                </span>
                <span class="font-mono text-slate-400 font-bold text-[11px] bg-slate-100 px-1.5 py-0.5 rounded">
                  ${doc.fileType}
                </span>
              </div>
              <h3 class="text-sm font-bold text-slate-900 leading-snug line-clamp-2">
                ${doc.title}
              </h3>
              <p class="text-xs text-slate-500 mt-1 flex items-center gap-2">
                <span>${doc.docNumber}</span>
                <span>•</span>
                <span>${doc.date}</span>
              </p>
            </div>
            <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
              <span class="truncate max-w-[220px]">${doc.fileName}</span>
              <span class="text-blue-600 font-semibold flex items-center gap-0.5 shrink-0">
                요약 보기 <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </span>
            </div>
          </div>
        `;
      }).join('');

      renderDetail();
      lucide.createIcons();
    }

    // Select Document
    function selectDocument(id) {
      currentSelectedId = id;
      renderList();
    }

    // Render Detail View
    function renderDetail() {
      const doc = documents.find(d => d.id === currentSelectedId);
      const container = document.getElementById('detailContainer');
      if (!doc) return;

      container.innerHTML = `
        <div class="space-y-6">
          <!-- Top Meta -->
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2.5 py-1 rounded-md text-xs font-bold ${doc.categoryBadge}">
                ${doc.categoryName}
              </span>
              <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                ${doc.fileType} 문서
              </span>
              <span class="text-xs text-slate-400 ml-auto font-mono">
                ${doc.date}
              </span>
            </div>
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
              ${doc.title}
            </h2>
            <div class="flex flex-wrap items-center gap-y-1 gap-x-3 text-xs text-slate-500 mt-2">
              <span><strong>문서번호:</strong> ${doc.docNumber}</span>
              <span>•</span>
              <span><strong>소관기관:</strong> ${doc.organization}</span>
            </div>
          </div>

          <!-- Document One-line Summary Card -->
          <div class="bg-blue-50/80 rounded-xl p-4 border border-blue-100">
            <h4 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-1 flex items-center gap-1.5">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-blue-600"></i> 핵심 요약 브리핑
            </h4>
            <p class="text-sm text-slate-700 leading-relaxed font-medium">
              ${doc.summary}
            </p>
          </div>

          <!-- Key Points / Table-like specs -->
          <div>
            <h4 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-1.5">
              <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-600"></i> 주요 내용 및 세부 정보
            </h4>
            <div class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden text-xs sm:text-sm">
              ${doc.keyPoints.map(kp => `
                <div class="grid grid-cols-1 sm:grid-cols-12 p-3 sm:px-4 bg-white hover:bg-slate-50 transition">
                  <div class="sm:col-span-4 font-bold text-slate-700 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span> ${kp.label}
                  </div>
                  <div class="sm:col-span-8 text-slate-600 mt-1 sm:mt-0 font-normal leading-relaxed">
                    ${kp.value}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- File Storage Info Box -->
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 space-y-1.5">
            <div class="flex items-center gap-2 font-bold text-slate-800">
              <i data-lucide="hard-drive" class="w-4 h-4 text-slate-500"></i> 프로젝트 폴더 저장 원본 파일
            </div>
            <p class="font-mono text-slate-500 truncate">
              파일명: <strong>${doc.fileName}</strong>
            </p>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${doc.tags.map(t => `<span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-[11px] text-slate-600 font-semibold">#${t}</span>`).join('')}
            </div>
          </div>
        </div>
      `;

      lucide.createIcons();
    }

    // On Load
    window.addEventListener('DOMContentLoaded', () => {
      updateCounts();
      renderList();
      lucide.createIcons();
    });
  </script>
